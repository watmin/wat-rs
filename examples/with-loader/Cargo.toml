[package]
name = "with-loader-example"
version = "0.1.0"
edition = "2021"
publish = false
description = "Arc 017 reference binary — wat::main! { ..., loader: \"wat\" } with a multi-file wat tree resolved via ScopedLoader."

[[bin]]
name = "with-loader-example"
path = "src/main.rs"

[dependencies]
wat = { path = "../.." }

# Inherit the workspace clippy wall (root [workspace.lints.clippy]): a finding is a
# FAILURE, not advice. NB `[lints]` is a TOP-LEVEL table — writing `lints.workspace`
# inside [package] parses as `package.lints` and cargo silently discards it.
[lints]
workspace = true
