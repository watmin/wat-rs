name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "8388608"   # matches .cargo/config.toml [env]

jobs:
  test:
    name: build + nextest
    runs-on: ubuntu-latest

    # `holon` is a SIBLING path dependency (Cargo.toml: `holon = { path = "../holon-rs" }`),
    # so the runner has to reproduce the local layout — the two repos side by side. The
    # default checkout puts wat-rs AT $GITHUB_WORKSPACE, which makes `../holon-rs` resolve
    # outside the workspace, and actions/checkout cannot write above $GITHUB_WORKSPACE.
    # So both repos are checked out into subdirectories instead, and every `run:` step
    # works from wat-rs/. Without this the job died at `cargo metadata` — before compiling
    # anything — so NEITHER the test gate nor clippy below has ever actually executed.
    defaults:
      run:
        working-directory: wat-rs

    steps:
      - name: Checkout wat-rs
        uses: actions/checkout@v4
        with:
          path: wat-rs

      # The VSA substrate wat is built on: public, unpublished (no crates.io release),
      # consumed as a path dep and used ~1438× across src/ — there is no build-without-holon
      # path, and it is not feature-gated. Folding holon into wat itself is the eventual
      # plan; until then this checkout is what makes `../holon-rs` resolve in CI the way it
      # does on a dev machine. Tracks holon-rs's default branch, matching local reality
      # (whatever is in ../holon-rs); add `ref: <sha>` here to pin instead.
      - name: Checkout holon-rs (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: watmin/holon-rs
          path: holon-rs

      # NO toolchain-install step, deliberately. `rust-toolchain.toml` pins the version
      # AND its components, and rustup (preinstalled on the runner) honors it for any
      # cargo invocation inside wat-rs/ — auto-installing on first use. Installing
      # `@stable` here would put clippy on a DIFFERENT toolchain than the one that
      # actually compiles, and would re-open the exact drift the pin exists to close:
      # on 2026-07-30 this box was on stable=1.93.0 while the runner was on
      # stable=1.97.0, and clippy read 0 here and 5 errors there.
      #
      # Removing the step is also what makes the pin TESTABLE. Today stable and the pin
      # are both 1.97.0, so with an install step a green run would prove nothing —
      # both paths reach the same compiler. With nothing else installing a toolchain,
      # a green run can only mean rustup resolved the file.

      # nextest: prebuilt binary, installed into the ephemeral CI container in seconds.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # mold is NOT optional here: .cargo/config.toml (committed) pins
      # `rustflags = ["-C", "link-arg=-fuse-ld=mold"]` for this target, so without it
      # every link dies with `collect2: fatal error: cannot find 'ld'`. Installing it
      # beats stripping the flag — that config's own note explains why the link is the
      # lever (~250 test binaries, each statically linking the wat monolith), and a
      # 2-core runner needs that collapse more than a dev box does, not less.
      #
      # apt, not taiki-e/install-action: that action does NOT carry mold, and its
      # cargo-binstall fallback resolves the name against crates.io — where `mold` is an
      # unrelated Rust crate with no binary, so it fails with "no binaries specified nor
      # inferred". The linker is a system package; install it as one.
      - name: Install mold (the linker .cargo/config.toml pins)
        run: sudo apt-get update && sudo apt-get install -y mold && mold --version

      # Print what rustup actually resolved from rust-toolchain.toml. Cheap, and it puts
      # the version in the log so a future local-vs-CI disagreement is one glance to
      # diagnose instead of an evening — which is precisely what it cost on 2026-07-30.
      - name: Show resolved toolchain
        run: rustc --version && cargo clippy --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wat-rs

      # The authoritative test gate — the WHOLE workspace (default-members), not just
      # the `wat` substrate crate. Arc-290: widened from `-p wat` so sibling crates
      # (wat-cli, wat-holon-lru, wat-lru, …) can never drift unseen again — they did,
      # for weeks, because this gate only ran `-p wat`. Per-test process isolation
      # neutralizes the arc-170 global-state leak; the per-test deadline
      # (.config/nextest.toml) turns a deadlock into a clean timeout instead of a wedge.
      - name: Test (nextest)
        run: cargo nextest run --profile ci --release

      # ARMED (arc 278 stone E). The floor is zero and this is what keeps it there.
      #
      # `--all-targets` is the load-bearing half. The 1874 → 0 campaign was measured on that
      # surface; plain `--workspace` lints lib+bins only and silently exempts every test,
      # example and bench — coverage narrower than the claim made for it, which is the same
      # shape of hole as a CI that never ran at all.
      #
      # `-D warnings` is NOT what fails clippy findings — [workspace.lints.clippy] already
      # denies those in the manifest, everywhere, with no flag. This catches the other half:
      # RUSTC-level warnings (unused imports, dead code) that a clippy lint table does not
      # reach. Deliberately NOT [workspace.lints.rust] warnings = "deny", which would fail
      # `cargo build` on an unused variable mid-edit — CI-strict, local-warn is the honest
      # split for rustc lints.
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings

  # ── THE ARC'S OWN CLOSING CONDITION, ARMED ─────────────────────────────────────────────────
  #
  # `PERF-ARC` states the bar as "differential-tested bit-for-bit against the wat oracle AND
  # benched at or past Clara". Half of that has always been gated: `spec_equals_native_on_every_
  # where_family` (nextest) compares native against the wat `$oracle` and needs no JVM. The CLARA
  # half needed a JDK the runner did not have, so `check-where-shapes.sh` was invoked by NO job —
  # and a Clara-parity regression merged fully green. `run-all.sh`'s own header records this
  # having already happened once, with four axes dead for days.
  #
  # It is the same shape of hole this file already documents twice: a gate that only ran `-p wat`
  # while sibling crates drifted for weeks, and a clippy run that lints lib+bins while exempting
  # every test. Coverage narrower than the claim made for it.
  #
  # A SEPARATE JOB, deliberately, not a step in `test`. A parity failure is a real finding but a
  # different one from a broken build, and burying it behind the test job's exit code would let
  # either mask the other. It also means the JVM install never slows the path that gates merges.
  #
  # `check-where-shapes.sh` already fails LOUDLY when java is absent (`exit 1`, not a skip), so
  # this job cannot silently pass by finding no toolchain — which is the failure mode that would
  # otherwise reproduce the exact hole it exists to close.
  grid-speed:
    # ── THE GRID'S SPEED HALF, WHICH RAN IN NO JOB UNTIL 2026-08-29 ──────────────────────────
    #
    # `circumspicere` found this gap. Its recorded reason — "needs Clara and a JDK the runner
    # lacks" — EXPIRED the day the `parity` job below installed Temurin 21 and a pinned Clojure
    # CLI, and nothing noticed. A second reason was offered and never written down: a shared
    # runner is noisy, so a wall-clock gate would flap.
    #
    # That second reason did not survive measurement either. The recorded 33-cell grid has a
    # TIGHTEST cell of 8.50x (median 22x, widest 59x) — nowhere near parity, so runner noise
    # cannot flip a verdict. It is also why this job does NOT gate on `:winner`, which at that
    # margin fires only on catastrophe and would have missed the real 4x regression this arc
    # already found. It gates on a per-axis RATIO FLOOR at ~50% of the recorded minimum: a ratio
    # cancels runner speed because both engines run in the same job on the same box, and a 2x
    # margin cannot flap. Reasoning and floors: `wat-scripts/perf/grid/check-grid-speed.sh`.
    #
    # SEPARATE JOB, not a step in `parity`: it costs ~2.5 min, and running it in parallel keeps
    # wall-clock flat while making a red attributable to the grid rather than to the where-family
    # diff sharing the job.
    name: clara grid (speed floors)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wat-rs
    steps:
      - name: Checkout wat-rs
        uses: actions/checkout@v4
        with:
          path: wat-rs

      - name: Checkout holon-rs (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: watmin/holon-rs
          path: holon-rs

      - name: Install mold (the linker .cargo/config.toml pins)
        run: sudo apt-get update && sudo apt-get install -y mold && mold --version

      # Temurin via the official action — the same org as `actions/checkout` above.
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Clojure CLI from the clojure org's own GitHub release, PINNED by version rather than
      # tracking `latest`: the parity verdict is a comparison against Clara 0.24.0, so the tool
      # that resolves that dep is part of the measurement and an unpinned installer would make
      # this job's answer drift without anyone changing a line here.
      - name: Install Clojure CLI
        run: |
          set -euo pipefail
          curl -fsSL -o linux-install.sh \
            https://github.com/clojure/brew-install/releases/download/1.11.3.1463/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh
          clojure --version

      - name: Build wat (the parity script runs the release binary)
        run: cargo build --release

      # THE VERDICT: every `where-*.wat` against its `.clj` twin, one diff. Clara is the third
      # reference and the arbiter of what the semantics ARE — the `$oracle` says what we intended.
      - name: Grid speed floors — every axis x its ladder
        run: bash wat-scripts/perf/grid/check-grid-speed.sh

  parity:
    name: clara parity (where-family)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wat-rs
    steps:
      - name: Checkout wat-rs
        uses: actions/checkout@v4
        with:
          path: wat-rs

      - name: Checkout holon-rs (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: watmin/holon-rs
          path: holon-rs

      - name: Install mold (the linker .cargo/config.toml pins)
        run: sudo apt-get update && sudo apt-get install -y mold && mold --version

      # Temurin via the official action — the same org as `actions/checkout` above.
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Clojure CLI from the clojure org's own GitHub release, PINNED by version rather than
      # tracking `latest`: the parity verdict is a comparison against Clara 0.24.0, so the tool
      # that resolves that dep is part of the measurement and an unpinned installer would make
      # this job's answer drift without anyone changing a line here.
      - name: Install Clojure CLI
        run: |
          set -euo pipefail
          curl -fsSL -o linux-install.sh \
            https://github.com/clojure/brew-install/releases/download/1.11.3.1463/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh
          clojure --version

      - name: Build wat (the parity script runs the release binary)
        run: cargo build --release

      # THE VERDICT: every `where-*.wat` against its `.clj` twin, one diff. Clara is the third
      # reference and the arbiter of what the semantics ARE — the `$oracle` says what we intended.
      - name: Clara parity — where-family
        run: bash wat-scripts/perf/grid/check-where-shapes.sh

      # THE THREE-WAY MOUTH: Clara == oracle == native on the query families (binding MAPS, not
      # just row counts). Found unreferenced by ANY file while wiring the job above — a working
      # 24-row gate that nothing had ever run, which is the same defect one directory over.
      - name: Clara parity — query mouth (three-way)
        run: bash wat-scripts/perf/grid/check-query-compat.sh
