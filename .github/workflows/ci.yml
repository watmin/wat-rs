name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "8388608"   # matches .cargo/config.toml [env]

jobs:
  test:
    name: build + nextest
    runs-on: ubuntu-latest

    # `holon` is a SIBLING path dependency (Cargo.toml: `holon = { path = "../holon-rs" }`),
    # so the runner has to reproduce the local layout — the two repos side by side. The
    # default checkout puts wat-rs AT $GITHUB_WORKSPACE, which makes `../holon-rs` resolve
    # outside the workspace, and actions/checkout cannot write above $GITHUB_WORKSPACE.
    # So both repos are checked out into subdirectories instead, and every `run:` step
    # works from wat-rs/. Without this the job died at `cargo metadata` — before compiling
    # anything — so NEITHER the test gate nor clippy below has ever actually executed.
    defaults:
      run:
        working-directory: wat-rs

    steps:
      - name: Checkout wat-rs
        uses: actions/checkout@v4
        with:
          path: wat-rs

      # The VSA substrate wat is built on: public, unpublished (no crates.io release),
      # consumed as a path dep and used ~1438× across src/ — there is no build-without-holon
      # path, and it is not feature-gated. Folding holon into wat itself is the eventual
      # plan; until then this checkout is what makes `../holon-rs` resolve in CI the way it
      # does on a dev machine. Tracks holon-rs's default branch, matching local reality
      # (whatever is in ../holon-rs); add `ref: <sha>` here to pin instead.
      - name: Checkout holon-rs (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: watmin/holon-rs
          path: holon-rs

      # NO toolchain-install step, deliberately. `rust-toolchain.toml` pins the version
      # AND its components, and rustup (preinstalled on the runner) honors it for any
      # cargo invocation inside wat-rs/ — auto-installing on first use. Installing
      # `@stable` here would put clippy on a DIFFERENT toolchain than the one that
      # actually compiles, and would re-open the exact drift the pin exists to close:
      # on 2026-07-30 this box was on stable=1.93.0 while the runner was on
      # stable=1.97.0, and clippy read 0 here and 5 errors there.
      #
      # Removing the step is also what makes the pin TESTABLE. Today stable and the pin
      # are both 1.97.0, so with an install step a green run would prove nothing —
      # both paths reach the same compiler. With nothing else installing a toolchain,
      # a green run can only mean rustup resolved the file.

      # nextest: prebuilt binary, installed into the ephemeral CI container in seconds.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # mold is NOT optional here: .cargo/config.toml (committed) pins
      # `rustflags = ["-C", "link-arg=-fuse-ld=mold"]` for this target, so without it
      # every link dies with `collect2: fatal error: cannot find 'ld'`. Installing it
      # beats stripping the flag — that config's own note explains why the link is the
      # lever (~250 test binaries, each statically linking the wat monolith), and a
      # 2-core runner needs that collapse more than a dev box does, not less.
      #
      # apt, not taiki-e/install-action: that action does NOT carry mold, and its
      # cargo-binstall fallback resolves the name against crates.io — where `mold` is an
      # unrelated Rust crate with no binary, so it fails with "no binaries specified nor
      # inferred". The linker is a system package; install it as one.
      - name: Install mold (the linker .cargo/config.toml pins)
        run: sudo apt-get update && sudo apt-get install -y mold && mold --version

      # Print what rustup actually resolved from rust-toolchain.toml. Cheap, and it puts
      # the version in the log so a future local-vs-CI disagreement is one glance to
      # diagnose instead of an evening — which is precisely what it cost on 2026-07-30.
      - name: Show resolved toolchain
        run: rustc --version && cargo clippy --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wat-rs

      # The authoritative test gate — the WHOLE workspace (default-members), not just
      # the `wat` substrate crate. Arc-290: widened from `-p wat` so sibling crates
      # (wat-cli, wat-holon-lru, wat-lru, …) can never drift unseen again — they did,
      # for weeks, because this gate only ran `-p wat`. Per-test process isolation
      # neutralizes the arc-170 global-state leak; the per-test deadline
      # (.config/nextest.toml) turns a deadlock into a clean timeout instead of a wedge.
      # excursus 001 `a-deadline-does-not-cost-a-ring` — the runner must describe itself.
      # ⭐ SOLVED 2026-09-16: the budget IS `RLIMIT_MEMLOCK` — ~8 KB per io_uring, accounted
      # PER-UID and SHARED ACROSS PROCESSES, so 8 MB ⇒ ~1024 rings for everything this user
      # runs. Measured ON THIS RUNNER by `src/bin/ring-ceiling.rs`: 1024 in one process alone,
      # and 332+254+254+184 = 1024 across four concurrent ones.
      # ⛔ An earlier version of this comment said memlock was REFUTED and "NOT the governor on
      # ≥5.12". That was WRONG, and wrong in an instructive way: `ulimit -l 0` genuinely does
      # pass on the dev box (Debian 6.12.63 does not charge rings to memlock) and that
      # measurement was generalised to a kernel nobody had measured. 6.17-azure DOES charge it,
      # at the identical 8 MB limit. The number has to come from the box that refuses.
      # These facts stay because they are cheap and because the next surprise here will be
      # somebody else's; they run BEFORE the tests so they survive a failing job.
      - name: Runner facts (io_uring diagnosis — see excursus 001)
        run: |
          echo "kernel:      $(uname -r)"
          echo "nproc:       $(nproc)"
          echo "memlock KB:  $(ulimit -l)   # THE io_uring budget here: ~8 KB/ring, PER-UID"
          echo "nofile:      $(ulimit -n)"
          free -m || true
          echo "io_uring_disabled: $(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 'absent')"
          echo "max_map_count:     $(cat /proc/sys/vm/max_map_count 2>/dev/null || echo 'absent')"
          cat /sys/fs/cgroup/memory.max 2>/dev/null | sed 's/^/cgroup memory.max: /' || true
          # ⭐ COMMIT ACCOUNTING — the one classic cause of a KILOBYTE mmap failing while
          # gigabytes are "available": strict overcommit (vm.overcommit_memory=2) caps total
          # committed address space at CommitLimit, and past it EVERY mmap returns ENOMEM
          # regardless of size. That matches the observed shape exactly (ring #15 refused at
          # `rings created-so-far=14`, and #245 in another process, with 14 GB available).
          # This box for contrast: overcommit_memory=0, CommitLimit 42 GB, Committed_AS 1.1 GB.
          echo "overcommit_memory: $(cat /proc/sys/vm/overcommit_memory)   # 0=heuristic 1=always 2=STRICT"
          echo "overcommit_ratio:  $(cat /proc/sys/vm/overcommit_ratio)"
          grep -E 'CommitLimit|Committed_AS' /proc/meminfo || true
          echo "ulimit -v (address space): $(ulimit -v)"
          echo "--- /proc/self/limits (the shell's; nextest children may differ) ---"
          cat /proc/self/limits || true

      # excursus 001 / arc 109 — the `ulimit -l` stopgap that used to live here is GONE, and its
      # removal is the ACCEPTANCE TEST for `DESIGN-one-ring-per-thread.md`. It raised RLIMIT_MEMLOCK
      # because ring count tracked WAITERS: a circuit run held up to 500 io_uring instances and four
      # concurrent nextest processes wanted ~2000 against this runner's ~1024 per-UID budget (8 MB ÷
      # ~8 KB per ring — measured here by src/bin/ring-ceiling.rs: 1024 alone, 332+254+254+184=1024
      # across four). Ring count now tracks THREADS: measured 500 → 29 per run, ~116 across four.
      # ⛔ If this job goes red on `IoUring::new … Cannot allocate memory` again, the stone did NOT
      # land and the honest response is to reopen it — not to put this line back.
      - name: Test (nextest)
        run: cargo nextest run --profile ci --release

      # ARMED (arc 278 stone E). The floor is zero and this is what keeps it there.
      #
      # `--all-targets` is the load-bearing half. The 1874 → 0 campaign was measured on that
      # surface; plain `--workspace` lints lib+bins only and silently exempts every test,
      # example and bench — coverage narrower than the claim made for it, which is the same
      # shape of hole as a CI that never ran at all.
      #
      # `-D warnings` is NOT what fails clippy findings — [workspace.lints.clippy] already
      # denies those in the manifest, everywhere, with no flag. This catches the other half:
      # RUSTC-level warnings (unused imports, dead code) that a clippy lint table does not
      # reach. Deliberately NOT [workspace.lints.rust] warnings = "deny", which would fail
      # `cargo build` on an unused variable mid-edit — CI-strict, local-warn is the honest
      # split for rustc lints.
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings
