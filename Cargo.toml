[workspace]
members = [
    ".",
    "crates/wat-reader",
    "crates/wat-macros",
    "crates/wat-doc",
    "crates/wat-edn",
    "crates/wat-to-edn-derive",
    "crates/wat-source-derive",
    "examples/with-loader",
    "examples/console-demo",
]
# default-members makes `cargo test` / `cargo build` / `cargo check` cover
# every workspace member, not just the root package. Without this an
# upstream surface change (e.g. arc 047 making `:wat::core::first` return
# `Option<T>` for Vec args) can rot a downstream crate's tests and stay
# invisible until someone explicitly runs `--workspace`. Pinning here
# keeps every crate honest at every checkpoint.
default-members = [
    ".",
    "crates/wat-reader",
    "crates/wat-macros",
    "crates/wat-doc",
    "crates/wat-edn",
    "crates/wat-to-edn-derive",
    "examples/with-loader",
    "examples/console-demo",
]

# clippy — declared ONCE here, exactly like `uuid` below, and for the same reason: a
# single site means drift is unrepresentable. Every member writes `lints.workspace = true`
# and inherits this.
#
# `deny`, not `warn`: a clippy finding is a FAILURE, the same weight as a red test — not
# advice to scroll past. Arc 278 stones A–E drove this floor 1874 → 0, and a floor you
# have to *remember* to check is a convention, which is the rung that rots. Putting it in
# the manifest means every invocation inherits it — your shell, a rider's shell, CI — with
# no `-D warnings` flag to forget. The wrong state stops being warned about and starts
# being uncompilable-under-clippy.
#
# Scope is `clippy::all` ONLY (correctness/suspicious/style/complexity/perf) — the exact
# set the campaign measured. `pedantic`/`nursery` are opt-in, noisy, and would reopen a
# large count for no gain. `priority = -1` keeps this a GROUP default so an individual
# lint can still be overridden above it later without a fight.
#
# The accepted cost, named: a toolchain bump can introduce a new lint that fires here and
# breaks the build until it is handled. That is the same bargain `-D warnings` makes, and
# it fails LOUDLY — which is the side of the trade this arc's law wants. There is no
# rust-toolchain.toml pin, so the toolchain floats; pinning it is the other half of this
# conversation if determinism is wanted.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# uuid — declared ONCE here; every crate that needs it writes `uuid.workspace = true`
# and inherits this version + features. Single version site → drift is unrepresentable
# (a crate that inherits cannot also name a version). v4/v5 unconditional: arc 296 killed
# the `mint` feature — uuid generation is core to wat, not an opt-in.
[workspace.dependencies]
uuid = { version = "1", features = ["v4", "v5"] }
# num-bigint/num-rational — arbitrary-precision integer + rational support for
# wat-edn's BigInt/Rational values. Workspace deps (builder-directed: one
# version, no drift) even though only wat-edn consumes them today — mirrors
# the uuid convention above. Arc 300 stone A (rationals in wat-edn).
num-bigint = "0.4"
num-rational = "0.4"
# num-traits — arc 300 stone C1: `ToPrimitive` for `bigint::to-f64`. Already a
# transitive dep of num-bigint/num-rational (resolved in Cargo.lock); declared
# directly here so `wat` can use `ToPrimitive` without a new resolution.
num-traits = "0.2"

# Trim dev debuginfo from full DWARF to line tables only. The full `tests/*.rs`
# dev gate links ~250 binaries; full debuginfo bloats every link. line-tables-only
# keeps the line-numbered panic backtraces we lean on (NOT debug=0, which would
# strip them) while cutting the link payload. `--release` already has debug=0, so
# this only touches the dev path. Pairs the mold linker switch in .cargo/config.toml.
[profile.dev]
debug = "line-tables-only"

[package]
name = "wat"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The wat language — parser, type checker, macro expander, and runtime for the 058 algebra surface."
repository = "https://github.com/watmin/wat-rs"

# Arc 170 — `wat-cli` folded into core. First `[[bin]]` entries this
# manifest has ever carried; `wat::distribution::run` (src/distribution/)
# is the library surface both wrap. The `name =` values are FIXED: `cargo
# wat` resolves only because the binary is literally named `cargo-wat` —
# cargo's subcommand dispatch convention, not something a rename survives.
[[bin]]
name = "wat"
path = "src/bin/wat.rs"

[[bin]]
name = "cargo-wat"
path = "src/bin/cargo-wat.rs"

[dependencies]
# `simd` is NOT holon's default (its `default = []`), so wat ran the scalar
# `dot_raw` loop for the whole of the substrate's life. Turned on 2026-08-02 —
# the SIMD similarity path is what the DDoS lab proved at line rate.
holon = { path = "../holon-rs", features = ["simd"] }
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
crossbeam-channel = "0.5"
io-uring = "0.7"
libc = "0.2"
regex = "1"
chrono = "0.4"
tempfile = "3"
wat-reader = { path = "crates/wat-reader" }
wat-macros = { path = "crates/wat-macros" }
wat-doc = { path = "crates/wat-doc" }
wat-source-derive = { path = "crates/wat-source-derive" }
wat-edn = { path = "crates/wat-edn" }
uuid.workspace = true
num-rational.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
rpds    = "1"
# Arc 198 slice 2 Stone 1 — link-time registry for Rust-side substrate
# restriction declarations. Stone 1 adds the wiring (RestrictionEntry +
# inventory::collect! + setup-time iteration); Stones 2-4 mint the
# proc-macro that submits entries, apply it to `*_join-result`, and retire
# arc 170 Stone B's ad-hoc walker rule.
inventory = "0.3"
# Arc 211a — auto-install panic_hook at library load time via #[ctor::ctor];
# impossible-to-forget by construction.
ctor = "1"
# Arc 278 stone S1 — `:rust::sqlite'` (src/rust_deps/sqlite.rs), the FIRST
# core default `:rust::` shim. rusqlite joins bigint as a hard core dep:
# `:wat::query` is backed by memory OR sqlite, both first-class core.
# `bundled` vendors sqlite itself — no system libsqlite3 dependency.
rusqlite = { version = "0.31", features = ["bundled"] }
# Arc 278 Cache Stone 1 — `:rust::cache::Lru` (src/rust_deps/cache.rs), the SECOND
# core default `:rust::` shim. A bounded cache is table-stakes substrate, so the
# `lru` crate joins rusqlite as a hard core dep: `wat/cache.wat` is baked into
# STDLIB_FILES and must resolve in every freeze. Same version the study oracle
# (crates/wat-lru) pins, so the workspace resolves ONE `lru`.
lru = "0.12"

[dev-dependencies]

# ─── Integration tests organized to mirror src/ ──────────────────────────────
# Convention (started 2026-05-19 with arc 214 Slice 3): tests/<module>/
# mirrors src/<module>/. Each module group registers via ONE `[[test]]` entry
# pointing at its `mod.rs` root; sub-files are picked up via standard Rust
# `mod` declarations inside that root.
#
# Cargo intentionally does not auto-discover subdirectory files as test
# binaries (subdirs are reserved for helper modules — the `tests/common/
# mod.rs` idiom). The `[[test]]` per-module entry is the minimum honest
# Cargo touch; ONE line per module group, no per-test boilerplate.
#
# Future test additions follow this pattern; flat `tests/*.rs` entries
# coexist during the gradual reorganization.

[[test]]
name = "comms"
path = "tests/comms/mod.rs"

[[test]]
name = "kernel"
path = "tests/kernel/mod.rs"

[[test]]
name = "channel"
path = "tests/channel/mod.rs"

[[test]]
name = "process"
path = "tests/process/mod.rs"

[[test]]
name = "function"
path = "tests/function/mod.rs"

[[test]]
name = "types"
path = "tests/types/mod.rs"

[[test]]
name = "collection"
path = "tests/collection/mod.rs"

[[test]]
name = "macros"
path = "tests/macros/mod.rs"

[[test]]
name = "rete"
path = "tests/rete/mod.rs"

[[test]]
name = "resolve"
path = "tests/resolve/mod.rs"

[[test]]
name = "services"
path = "tests/services/mod.rs"

[[test]]
name = "reflection"
path = "tests/reflection/mod.rs"

[[test]]
name = "value"
path = "tests/value/mod.rs"

[[test]]
name = "program"
path = "tests/program/mod.rs"

[[test]]
name = "diagnostics"
path = "tests/diagnostics/mod.rs"

[[test]]
name = "lint"
path = "tests/lint/mod.rs"

[[test]]
name = "wat_lang"
path = "tests/wat_lang/mod.rs"

# Arc 170 — `wat-cli` folded into core; its `tests/wat_cli.rs` (16 tests)
# moved here + gained a synthetic Battery fixture (tests/cli/synthetic_battery.rs).
[[test]]
name = "cli"
path = "tests/cli/mod.rs"

# ─── Benchmarks — 296 Stone K, move 1 ─────────────────────────────────────────
# `#[ignore]` used to mean two incompatible things: "blocked/broken" (debt) and
# "deliberately outside the floor" (an instrument). A throughput measurement that
# asserts nothing meaningful is the second kind, and belongs here — cargo has had
# `benches/` + `[[bench]]` the whole time. `harness = false` because these are
# manual-timing measuring sticks (Instant::now() + eprintln), not `#[bench]`
# (nightly-only) or criterion; a benchmark here is structurally NOT in the test
# binary, so it cannot inflate the `#[ignore]` count — the category is enforced by
# cargo's target graph, not a string a future hand has to write and read correctly.
# Run: cargo bench --bench <name>
[[bench]]
name = "perf_arc278_fire_baseline"
path = "benches/perf_arc278_fire_baseline.rs"
harness = false

# Inherit the workspace clippy wall (root [workspace.lints.clippy]): a finding is a
# FAILURE, not advice. NB `[lints]` is a TOP-LEVEL table — writing `lints.workspace`
# inside [package] parses as `package.lints` and cargo silently discards it.
[lints]
workspace = true
