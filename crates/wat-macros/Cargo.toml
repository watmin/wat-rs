[package]
name = "wat-macros"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Procedural macros for wat-rs. `#[wat_dispatch]` generates Rust-to-wat shim code (dispatch, scheme, registration) from annotated impl blocks."
repository = "https://github.com/watmin/wat-rs"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
wat-doc = { path = "../wat-doc" }
wat-reader = { path = "../wat-reader" }
# arc 255 "the walls must not be muted" / the ```edn doc row — the proc-macro parses the
# ```edn fence at EXPAND time (a proc-macro cannot consult the runtime type registry, so the
# tag is validated by name here, not resolved). No cycle: wat-edn does not depend on
# wat-macros. Proven safe by a `#[test]` inside this crate before this dependency was added
# for real (see SCORE-the-two-probes-and-a-third-muted-wall.md, probe (a)).
wat-edn = { path = "../wat-edn" }

[dev-dependencies]
trybuild = "1"

# Inherit the workspace clippy wall (root [workspace.lints.clippy]): a finding is a
# FAILURE, not advice. NB `[lints]` is a TOP-LEVEL table — writing `lints.workspace`
# inside [package] parses as `package.lints` and cargo silently discards it.
[lints]
workspace = true
