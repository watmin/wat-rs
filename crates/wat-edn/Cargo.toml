[package]
name = "wat-edn"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Spec-conforming EDN parser and writer for Rust — typed wire format for the wat language and wider Clojure-EDN ecosystem."

[features]
# `derive` re-exports the companion `wat-to-edn-derive` proc-macro so
# consumers write `#[derive(wat_edn::ToEdn)]` (the serde/serde_derive pattern).
# ON by default: in an EDN language, being-EDN is the rule, not an opt-in — the
# derive is the mechanism a type becomes EDN. Parser-only consumers opt OUT via
# `default-features = false`. Arc 296.
default = ["derive"]
derive = ["dep:wat-to-edn-derive"]

[dependencies]
wat-to-edn-derive = { path = "../wat-to-edn-derive", optional = true }
chrono       = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid.workspace = true
num-bigint   = "0.4"
bigdecimal   = "0.4"
memchr       = "2"
thiserror    = "1"
compact_str  = "0.8"
serde_json   = "1"

[dev-dependencies]

[lib]
name = "wat_edn"
path = "src/lib.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"
