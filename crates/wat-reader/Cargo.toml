[package]
name = "wat-reader"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The wat reader front-end: span, identifier, AST, lexer, and parser. A closed std-only set depended on by both the main wat crate and wat-macros (proc-macro). Extracted so discovery can use the REAL parser, eliminating the hand-rolled lexer in wat-macros."
repository = "https://github.com/watmin/wat-rs"

[dependencies]
# PROBE (arc 296 stone A): wat-reader depends on wat-edn so Span can derive
# ToEdn from below the parser — the cycle-break the split exists for. The
# `derive` feature is on by wat-edn's default.
wat-edn = { path = "../wat-edn" }
# Arc 296 stone D: `#[derive(Edn)]` on Pos (and eventually Span) emits
# `::inventory::submit!(::wat_edn::EdnSchema { … })` in the generated code.
# That code is compiled in this crate's context, so inventory must be a
# direct dependency here so `::inventory` resolves.
inventory = "0.3"
# Arc 300 stone B — rational literals (`1/2`) in wat SOURCE. Same workspace
# version as wat-edn's Stone A `Value::Rational` (arc 300 stone A); no
# version drift between the two layers.
num-rational.workspace = true
num-bigint.workspace = true
