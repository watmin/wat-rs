[package]
name = "wat-doc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Shared prose+@tag doc-comment parser for wat-rs. One parser depended on by both wat-macros (proc-macro, intrinsics) AND wat (runtime/checker, wat forms) — so the intrinsic and wat-form doc contracts cannot drift. Parity by construction (arc 255)."
repository = "https://github.com/watmin/wat-rs"

[dependencies]
wat-source-derive = { path = "../wat-source-derive" }
# Arc 109 stone "the smart comments must be compliant": the @arg/@ret type-token
# check asks the reader what a type may be spelled, rather than a hand-rolled
# `starts_with(':')` shape test. Adds nothing to the graph — wat-doc already
# depends transitively on wat-reader via wat-source-derive, whose own manifest
# states the reason: "so both wat-doc and the main crate can use it without a
# cycle." wat-reader depends only on wat-edn.
wat-reader = { path = "../wat-reader" }

# Inherit the workspace clippy wall (root [workspace.lints.clippy]): a finding is a
# FAILURE, not advice. NB `[lints]` is a TOP-LEVEL table — writing `lints.workspace`
# inside [package] parses as `package.lints` and cargo silently discards it.
[lints]
workspace = true
