# 296 Stone K, move 3 — the slow profile. `all()` re-admits everything
# `[profile.default]`'s `default-filter` excludes EXCEPT the three STOP-2
# diagnostics, which are expected to fail/error every run (their failing
# .wat fixture load IS the diagnostic) — admitting them here would make
# `--profile slow` permanently red for a reason that has nothing to do with
# regressions. What's left when you subtract them: the normal floor PLUS
# the million-depth boundary probe PLUS the dispatch_keyword_head_value_perf
# STOP-1 fallback — both genuine, assertion-bearing tests that pass. Gate
# row 5: prove this profile runs the boundary probe and it passes, not
# just that the config parses.
[profile.slow]
slow-timeout = { period = "15s", terminate-after = 2 }
retries = 0
fail-fast = false
default-filter = 'all() - test(diag_first_over_form) - test(diag_first_over_vector_form) - test(diag_keyword_to_string_over_form)'

