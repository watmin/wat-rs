# nextest config — the test-runner gate for wat-rs.
#
# WHY: each test runs in its OWN forked process, so the arc-170 execve
# global-state leak (a non-execve'd spawn leaking globals) cannot cross tests —
# the consolidated test homes stop polluting each other. A test that exceeds the
# deadline is SIGTERM'd then SIGKILL'd, so the leak's intermittent deadlock
# becomes a clean per-test timeout failure instead of a wedged run (no manual kills).
[profile.default]
# Most tests finish <1s; spawn-heavy ones <10s; a deadlocked test hangs forever.
slow-timeout = { period = "15s", terminate-after = 2 }   # warn at 15s, kill at 30s
retries = 0
fail-fast = false
# 296 Stone K — the structural exclusion mechanism `#[ignore]` used to fake with a
# greppable "ON-DEMAND (not debt)" string. Five tests are deliberately outside the
# default floor, for three DIFFERENT reasons — this is the DESIGNATED home, not an
# attribute on the test:
#   - self_recursion_via_if_at_million_depth — move 3: a genuine test (asserts, can
#     fail), excluded on RUNTIME (it's slow, not broken). Runs + passes under
#     `--profile slow` (see below). Stone K gate row 5.
#   - dispatch_keyword_head_value_perf — move 1's STOP-1 fallback: a manual perf
#     harness that belongs in `benches/` but can't get there without making a
#     private dispatch internal `pub` (see the comment at its definition in
#     src/runtime.rs). Included under `--profile slow`'s `all()`; it passes (a real
#     assertion, not a timing gate).
#   - diag_first_over_form / diag_first_over_vector_form / diag_keyword_to_string_over_form
#     — move 2's STOP-2 fallback: each one's `.wat` fixture does not load on the
#     current runtime (that failure IS the diagnostic), so `wat-scripts/`'s
#     `every_wat_scripts_file_loads` gate would go red if they moved there. They stay
#     plain `#[test]`s, invoked explicitly by name to read the gap — NOT re-admitted
#     under `--profile slow`, because they are expected to fail/error every time, and
#     `all()` there is meant to stay green (see `[profile.slow]` below).
default-filter = 'not test(self_recursion_via_if_at_million_depth) and not test(dispatch_keyword_head_value_perf) and not test(diag_first_over_form) and not test(diag_first_over_vector_form) and not test(diag_keyword_to_string_over_form)'

[profile.ci]
slow-timeout = { period = "20s", terminate-after = 3 }   # a touch more headroom in CI
# ⛔ retries = 0, AND IT MUST STAY 0. This was `retries = 1`, commented "absorb a
# rare leak-flake; surfaces as flaky, not failed" — i.e. the runner re-ran on a red
# and relabelled it. That is "known flake, it's fine to not report it", automated:
# the second run passing DESTROYS the only evidence the first run produced, and the
# report says "flaky" where the truth is "failed, once, with an arm nobody kept".
# Struck 2026-08-05 at the builder's direction — "it is not fine, it cannot be
# tolerated, it must be annihilated." A red is a red; the arm is the finding.
retries = 0
fail-fast = false

# The wat-scripts load gate freezes EVERY .wat under wat-scripts/ in ONE test
# — legitimately CPU-heavy and it GROWS WITH THE CORPUS every time a probe lands.
#
# ⚠ THIS DEADLINE HAS NOW BEEN RAISED TWICE, AND THAT IS THE REAL SIGNAL.
#   2026-07-25:  45s/90s  ->  120s/240s.  Measured 88.085s on a full floor: 2s of margin.
#   2026-08-16:  120s/240s -> 300s/600s.  It TIMED OUT at the 240s kill.
#
# MEASURED 2026-08-16, and the numbers say the budget stopped covering the work:
#   the gate ALONE (no contention) ............  62.8s
#   the gate under a full floor ...............  219.097s   ← against the old 240s kill
#   margin at the old deadline ................  20.9s = 8.7%   ← why it flipped run to run
#   .wat files under wat-scripts/ .............  327
#   .wat ADDED to wat-scripts/ since 2026-07-25   158   — the corpus roughly DOUBLED
#
# The 3.5x contention factor is expected (a CPU-bound parse+typecheck of 327 files sharing
# the box with 12-14 concurrent test processes); what changed is the corpus. It passed AND
# timed out on the IDENTICAL corpus the same day — 8.7% of margin is a coin flip, not a
# budget, which is why this is a real failure and not a flake.
#
# ★ AND NOTE THE SHAPE, because it reframes the whole thing: that run's TOTAL was 223.094s.
# THE GATE IS 98% OF THE FLOOR'S WALL-CLOCK. It is not "a slow test" — it IS the floor, and
# every other test overlaps inside it (which is exactly what `priority = 100` arranges). Any
# future attempt to make the suite faster that does not touch this test is rounding error.
#
# ⛔ RAISING A NUMBER IS NOT A FIX, AND THIS ONE IS EXPLICITLY A STOPGAP. Builder,
# 2026-08-16: "raise the timeout ... making our parser faster is medium term.. not now."
# The durable fixes, in the order I'd draw them: SPLIT the gate per-directory
# (fixes/ · scratch-pad/ · probes/ · perf/), so each fits its budget and a failure names
# which directory broke — the `binary_id`/filter machinery below already does this shape;
# or make the freeze itself cheaper, which needs a per-file cost measurement nobody has
# taken. At the current growth rate (+158 files in 3 weeks) 600s buys months, not years.
#
# `priority` (higher runs earlier) starts it in the FIRST wave rather than letting
# it become the long pole at the end — it then overlaps the other ~4100 tests
# instead of running after them. Wall-clock win, and it stops a slow-but-healthy
# gate from looking like a hang under end-of-run contention.
[[profile.default.overrides]]
filter = 'test(a_counter_increments_across_turns)'
slow-timeout = { period = "120s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'test(every_wat_scripts_file_loads_on_the_current_runtime)'
slow-timeout = { period = "300s", terminate-after = 2 }   # warn 300s, kill 600s
priority = 100                                            # schedule first

# C19 (arc 278) — the diagnostic-determinism gate: every `.wat.bad` run TWICE in two fresh
# processes, byte-identical output required (tests/lint/diagnostic_output_is_deterministic.rs).
#
# ⚠ ORDER IS LOAD-BEARING, same trap the `binary_id(wat::lint)` note below records: these tests
# live INSIDE the lint binary, so this rule MUST stay ABOVE that one. Below it, the broader filter
# would swallow them and hand them the default 15s/30s deadline, which a shard cannot meet.
#
# THE NUMBER, DERIVED NOT PICKED (measured 2026-09-03 on this box, 8 cores):
#   `wat` per run on this corpus ..............  ~0.30s  (~0.16s of it is process startup alone)
#   `.wat.bad` in the tree ....................  268  (266 asserted over, 2 quarantined)
#     ⛔ WAS `281 (278 asserted over, 3 quarantined)`, and it went stale the same day it was
#     written: C18 (`04abe37fc`) renamed 13 fixtures that did not fail, and C20 (arc 278)
#     dequarantined one. The derivation below is UNAFFECTED — a smaller corpus is cheaper, so
#     the 90s/180s budget keeps its margin — but a derivation nobody re-derives is how a
#     budget silently stops matching its workload. Re-derive with:
#       find . -name '*.wat.bad' -not -path './target/*' | wc -l
#   full corpus twice, sequential .............  ~167s CPU
#   full corpus twice, 8-way parallel .........  33.4s wall  (3m55s CPU)
#   ONE shard (16 shards, ~17 files = ~35 runs)  ~10.4s alone
#   at this repo's own recorded contention band (3.5x-4.4x, see the rete cohort below): 36-46s
# Warn 90s / kill 180s is ~2x margin on the top of that projection — the same generosity, and the
# same derivation, the rete cohort's budget was given.
#
# ⛔ IF THIS EVER NEEDS RAISING, SPLIT INSTEAD. `N_SHARDS` in the gate is one constant; raising it
# is the durable fix that the scripts gate above has twice been unable to take. Raising a number
# here is not.
#
# `priority = 99` puts the shards in the same early wave as the lint binary they belong to. Without
# it they would fall through to the default priority and become the tail the whole floor waits on —
# 33s of wall added at the END rather than overlapped inside the scripts gate's window.
[[profile.default.overrides]]
filter = 'test(every_wat_bad_diagnostic_is_byte_stable)'
slow-timeout = { period = "90s", terminate-after = 2 }    # warn 90s, kill 180s
priority = 99

# The REST of the lint binary, immediately behind the scripts gate.
#
# The `lint` target (Cargo.toml:219, tests/lint/mod.rs) is the second-longest
# thing in the suite — MEASURED 2026-08-02: 66 tests, **40.5s**, and it grows
# every time a wall is added. Same argument as the gate above, one rung down:
# a long binary that STARTS late becomes the tail the whole run waits on, so
# schedule it early and let it overlap the other ~4200 tests instead of
# trailing them.
#
# ⚠ ORDER IS LOAD-BEARING. Overrides are matched top-down, so this MUST stay
# BELOW the `every_wat_scripts_file_loads_on_the_current_runtime` rule — that
# test lives INSIDE this very binary (tests/lint/wat_scripts_fixes_load.rs).
# Above it, this broader filter would swallow the gate and strip its 300s/600s
# timeout, walking the 88s freeze back into a SIGTERM. Only `priority` is set
# here; every other setting falls through to the profile default.
[[profile.default.overrides]]
filter = 'binary_id(wat::lint)'
priority = 99                                             # just below the scripts gate

# The rete cohort — the grid axes + the spec==native oracle + the accumulator census.
#
# ⛔ SAME STOPGAP SHAPE AS THE SCRIPTS GATE ABOVE, AND IT IS THE SECOND ONE. Raising a
# number is not a fix. It is recorded here with the measurement so the next raise has to
# argue with data instead of repeating "just double it".
#
# MEASURED 2026-08-17, each test ALONE (plain `cargo test`, nextest bypassed so no
# deadline could truncate it) against its duration under a full floor:
#
#   test                                        alone    under floor   contention
#   accum_fire_phase_census ..................   8.13s   12.9–14.6s     1.6–1.8x
#   grid_axes_run_and_derive_nonvacuously ....   7.98s   18.7–21.1s     2.3–2.6x
#   spec_equals_native_on_every_where_family .  13.77s   never finished     —
#
# ★ ALL THREE PASS ALONE. There is no hang — that had to be proven, not assumed, because
# a timeout is the ONLY thing standing between the floor and the genuine `where`-predicate
# hang/SIGSEGV hazard (tasks #58/#86). Raising a deadline over an uncharacterized timeout
# would have papered over exactly that.
#
# ★ WHY IT FIRED NOW: `spec_equals_native_on_every_where_family` is NEW (grok, b4e2985a)
# and is the heaviest of the three at 13.77s alone. At this cohort's own historically
# observed contention (2.3x–3.5x) it lands at 31.7s–48.2s — i.e. it CANNOT fit the 30s
# kill at ANY factor this cohort has ever shown. It was over budget on arrival, and its
# added load pushed the contention factor up for its two neighbours, which had 1.6x/2.3x
# headroom and lost it. Three simultaneous timeouts, one cause.
#
# THE NUMBER, derived not picked: worst case is 13.77s x 3.5 = 48.2s. Warn 60s / kill 120s
# gives ~2.5x margin on that projection — the same generosity the scripts gate above was
# given (219s observed -> 300s warn / 600s kill). `priority` puts them in an early wave so
# they overlap the bulk instead of contending with the tail, per the same argument as the
# lint binary above.
#
# ✅ VERIFIED ON THE FIRST GREEN FLOOR AFTER THIS CHANGE (4697/4697, 220.334s). The
# projection for the new test was accurate to 0.5s — and the OTHER TWO WERE UNDER-ESTIMATED,
# so record the real spread rather than the borrowed 3.5x:
#
#   test                            alone     under floor   ACTUAL contention   margin @120s
#   accum_fire_phase_census .....   8.13s        35.39s          4.35x             3.4x
#   grid_axes_run_and_derive ....   7.98s        29.42s          3.69x             4.1x
#   spec_equals_native ..........  13.77s        48.72s          3.54x             2.5x
#
# ⚠ `accum_fire_phase_census` went 12.9–14.6s (three prior runs, tight spread) -> 35.39s.
# That 2.4x jump is consistent with `priority = 98` moving it into the SAME early wave as
# the scripts gate (100) and the lint binary (99) — i.e. the two heaviest things in the
# suite. That is the overlap working as designed, not a regression: the gate IS ~98% of the
# floor's wall-clock (see its note above), so "early" means "inside the gate's window", and
# the floor's TOTAL was unchanged (220.3s vs 215.8s before). But it is worth stating plainly
# that the individual times went UP, because a naive reading of "priority makes it start
# sooner" predicts the opposite, and the budget above has to cover the wave it lands in.
#
# So the real contention band for this cohort is 3.5x–4.4x, not 3.5x. A future test added
# here should be budgeted at alone x 4.4, not x 3.5.
#
# 2026-08-17 later the same day: where-query-compat added 13 rows / 3 fires to the
# spec_equals walk. Isolated after that add: 22.3–23.6s. Still inside this 60s/120s
# envelope; do not add a second named override above this block — first-match would
# strip `priority = 98` and put spec_equals back at the tail.
#
# THE DURABLE FIX, named so this stays a stopgap and not a habit: split
# `spec_equals_native_on_every_where_family` PER where-family, the way the scripts gate
# should split per directory. Each piece then fits a normal budget and a failure names
# which family broke instead of "the oracle timed out". Not built.
#
# `accum_fire_phase_census` lives in the lib binary (`binary_id(wat)`), not `wat::rete` —
# hence the explicit `or`, because a `binary_id(wat::rete)` filter alone silently misses it.
#
# `deftest_wat_tests_rete_fuzz_*` is the SECOND instance of that same trap, found by
# `circumspicere` 2026-08-26. It is the wat-side rete differential fuzzer
# (`wat-tests/rete/differential-fuzz.wat`) and it compiles into `wat::kernel`, via
# `tests/kernel/test.rs`'s `wat::test! {}` auto-discovery — so despite being the same
# workload class as this cohort it received none of this headroom. It measured 17.165s on
# `.floor/2026-08-26T05-29-30Z` and tripped SLOW, against a DEFAULT-profile kill at 30s:
# 1.75x headroom on a cohort whose own contention band, recorded above, is 3.5x-4.4x.
#
# The file itself argues for a 60s budget at length (`differential-fuzz.wat:262-268`,
# `(:wat::test::time-limit "60s")`) and that budget was UNREACHABLE — nextest SIGTERMs at
# 30s, half of it. `excusare` upheld the annotation as sanctioned; no ward checked whether
# the runner could grant it. A wat-side budget the runner kills through is not a budget.
#
# PROOF THIS FILTER MATCHES — by mutation, not by assertion (2026-08-26). Drop THIS rule's
# period to 1s and the test prints `SLOW [> 1.000s]` once a second under
# `cargo nextest run --release -E 'test(deftest_wat_tests_rete_fuzz)'`; restore the period and
# it goes silent. The NAIVE check does not work and was tried first: run in isolation the test
# was under even the OLD 15s warn, so an absent SLOW line proves nothing either way. The LOADED
# cost is the only number the kill sees.
#
# BUDGET RAISED 60s -> 90s, 2026-08-27, because the space grew (retraction, then a second
# accumulator kind: 1260 -> 2520 -> 3168 shapes). Loaded cost went 17.165s -> 52.064s, which left
# only 8s under a 60s warn. Raised deliberately rather than shrinking the space — the fuzzer's own
# header argues that trade and this follows it. Note the wat-side `(:wat::test::time-limit "90s")`
# now equals this period, which is the ORDER we want: the wat harness fails first and names the
# test and the budget, and nextest's kill (2 x 90s = 180s) is the backstop behind it.
#
# 2026-08-27: `deftest_wat_tests_rete_tms` added — the operation-sequence / truth-maintenance
# fuzzer. It is a SEPARATE substring because the deftest namespace is `..::tms::`, not `..::fuzz::`,
# and the existing filter would have missed it exactly the way `binary_id(wat::rete)` once missed
# the wat deftests. It was caught the loud way: the test TIMED OUT at nextest's default 30s kill
# on its first run.
#
# The filter is a SUBSTRING match and now covers TWO tests: the differential itself and
# `..._test_accumulate_kinds_are_not_vacuous` (0.55s loaded), which gates the measured table
# justifying the accumulate widening. Both wanted the same generous budget; the fast one does not
# need it and does not suffer from it.
[[profile.default.overrides]]
filter = 'binary_id(wat::rete) or test(accum_fire_phase_census) or test(deftest_wat_tests_rete_fuzz) or test(deftest_wat_tests_rete_tms)'
slow-timeout = { period = "90s", terminate-after = 2 }    # warn 90s, kill 180s
priority = 98                                             # just below the lint binary

# Arc 278, C20 — the two check-error source-order regression tests
# (tests/services/probe_arc278_c20_check_errors_in_source_order.rs). Each spawns 24 fresh `wat`
# processes, because the defect they guard is a per-process hash draw and a test that ran the
# binary twice would go green over a live bug about a third of the time (the derivation is in
# that file's header).
#
# THE NUMBER, DERIVED NOT PICKED. 24 sequential runs measured on this box, release, 6 samples:
#   c2_mixed_macro_swap ....  9.64 9.73 9.69 9.74 9.66 9.68 s   (median 9.69, spread 0.10)
#   w2a_kwargs_check_mint ..  8.00 7.94 7.91 7.87 7.92 7.96 s   (median 7.93, spread 0.13)
# At this repo's own recorded floor-contention band (3.5x-4.4x, derived for the rete cohort
# above) the worse of the two projects to 33.9-42.9s — i.e. it CANNOT fit the default 30s kill
# at any factor this repo has measured, the same shape as the rete cohort's arrival. Warn 90s /
# kill 180s is ~2.1x margin on the top of that projection, the same generosity the rete and
# C19 cohorts were given on the same reasoning.
#
# ⛔ IF THIS EVER NEEDS RAISING, LOWER `RUNS` ONLY WITH THE ARITHMETIC. The run count is the
# test's sensitivity, not a knob: at p≈0.58 the false-green probability is p^N, so 24 -> 12
# trades a 1-in-30,000 blind spot for 1-in-176. Splitting per fixture (already done — that is
# why there are two tests, not one 17.6s test) is the cheap lever and it is spent.
#
# `priority = 98` puts them in the same early wave as the rete cohort so ~18s of process
# spawning overlaps the scripts gate's window instead of becoming the floor's tail.
[[profile.default.overrides]]
filter = 'test(check_errors_are_in_source_order_every_run)'
slow-timeout = { period = "90s", terminate-after = 2 }    # warn 90s, kill 180s
priority = 98

