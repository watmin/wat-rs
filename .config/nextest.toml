# nextest config — the test-runner gate for wat-rs.
#
# WHY: each test runs in its OWN forked process, so the arc-170 execve
# global-state leak (a non-execve'd spawn leaking globals) cannot cross tests —
# the consolidated test homes stop polluting each other. A test that exceeds the
# deadline is SIGTERM'd then SIGKILL'd, so the leak's intermittent deadlock
# becomes a clean per-test timeout failure instead of a wedged run (no manual kills).
[profile.default]
# Most tests finish <1s; spawn-heavy ones <10s; a deadlocked test hangs forever.
slow-timeout = { period = "15s", terminate-after = 2 }   # warn at 15s, kill at 30s
retries = 0
fail-fast = false

[profile.ci]
slow-timeout = { period = "20s", terminate-after = 3 }   # a touch more headroom in CI
retries = 1                                              # absorb a rare leak-flake; surfaces as flaky, not failed
fail-fast = false

# The wat-scripts load gate freezes EVERY .wat under wat-scripts/ in ONE test
# — legitimately CPU-heavy and it GROWS WITH THE CORPUS every time a probe lands.
#
# ⚠ MEASURED 2026-07-25: this test took **88.085s** on a full-floor run, against a
# 90s kill. TWO SECONDS of margin — and several probes landed that same day. The
# old 45s/90s was already breaching in practice, so it is raised generously:
# warn at 120s, kill at 240s. A genuine hang still dies; corpus growth no longer
# walks us into a SIGTERM mid-freeze.
#
# `priority` (higher runs earlier) starts it in the FIRST wave rather than letting
# it become the long pole at the end — it then overlaps the other ~4100 tests
# instead of running after them. Wall-clock win, and it stops a slow-but-healthy
# gate from looking like a hang under end-of-run contention.
[[profile.default.overrides]]
filter = 'test(every_wat_scripts_file_loads_on_the_current_runtime)'
slow-timeout = { period = "120s", terminate-after = 2 }   # warn 120s, kill 240s
priority = 100                                            # schedule first

[[profile.ci.overrides]]
filter = 'test(every_wat_scripts_file_loads_on_the_current_runtime)'
slow-timeout = { period = "120s", terminate-after = 2 }
priority = 100
